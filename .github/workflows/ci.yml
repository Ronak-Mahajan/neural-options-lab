name: CI

on:
  push:
    # Feature branches run CI too. A branch that only builds once it reaches
    # main is a branch whose failures are discovered by the merge.
    branches: [main, master, "fix/**", "rebuild/**"]
  pull_request:

# The failure-log step below commits the tail of a failed run back to the
# branch. Actions logs are not readable without a token, so that write-back is
# the only way a failure on a feature branch gets read.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the FLOOR, not a preference: requirements.txt pins
        # numpy~=2.5.1, and every numpy 2.5.x requires Python >=3.12. The
        # matrix used to list 3.10 as well, which meant that job failed at
        # `pip install -r requirements.txt` on every commit since the pins
        # landed — it never once reached pytest, so it was reporting an
        # unsatisfiable config as a test failure and nothing was ever verified
        # against 3.10. Raise this in step with the pins, not ahead of them.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Teed into the same ci.log the failure step writes back. A resolver
        # failure here used to produce NO readable log at all: ci.log did not
        # exist yet, so the write-back step's own `tail` failed and the branch
        # got nothing. That is the failure mode the write-back exists for -
        # the 3.10 matrix leg died at this step on every commit for weeks.
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            # CPU-only torch: the GPU wheel is ~2.5 GB and CI needs none of it.
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install -r requirements.txt
            pip install pytest
          } 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      - name: Show resolved versions
        run: pip list

      - name: Run tests
        # Network-dependent tests (yfinance, Deribit) are marked and skipped;
        # everything else must pass, including the shipped-checkpoint load and
        # the API surface (tests/test_api.py runs the app in-process).
        #
        # tee, then exit on pytest's status rather than tee's: without
        # PIPESTATUS a failing suite would be reported as a passing step
        # because tee exited 0.
        run: |
          set -o pipefail
          python -m pytest tests/ -v -m "not network" --durations=10 \
            2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      - name: Commit failure log
        # main is never written to by CI. On a feature branch the tail of the
        # failing run is committed so it can be read from the repository.
        if: failure() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p .ci
          # Guard: a failure before any step teed anything (checkout, setup)
          # must still write back a file rather than failing on a missing one.
          touch ci.log
          tail -c 60000 ci.log > .ci/last-failure-test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-failure-test.log
          git commit -m "ci: failure log [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
