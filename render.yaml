services:
  - type: web
    name: neural-options-lab
    runtime: docker
    # The live demo runs on the Starter plan (always on, no idle spin-down,
    # 512 MB); the service is sized to fit the free plan too, see DEPLOY.md.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
